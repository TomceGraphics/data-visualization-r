site_name: Data Visualization in R Course
site_description: A comprehensive guide to data visualization and manipulation in R.
site_url: https://tomcegraphics.github.io/data-visualization-r/
repo_name: TomceGraphics/data-visualization-r
repo_url: https://github.com/TomceGraphics/data-visualization-r
copyright: "Copyright &copy; 2026 TomceGraphics - Licensed under GPL-3.0"
site_author: TomceGraphics

theme:
  name: material
  logo: assets/logo-r-script.svg
  favicon: assets/logo-r-script.svg
  icon:
    logo: material/chart-areaspline
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/list-unordered-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-circle-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: octicons/moon-16
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: octicons/sun-16
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.tags

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Data Transformation:
      - Overview: transformation_overview.md
      - Arrange: arrange.md
      - Group By: group_by.md
      - Mutate: mutate.md
      - Rename: rename.md
  - String Manipulation:
      - Overview: string_overview.md
      - Searching: string_searching.md
      - Replacing: string_replacing.md
      - Cleaning & Measuring: string_cleaning.md
